name: Java CI

on:
  push:
    branches: [ main, java-springboot-rebuild ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify Spring Boot application
        run: mvn -B clean verify
      - name: Verify production Docker image builds
        run: docker build -t happy-tails-ci .
