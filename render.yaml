services:
  - type: web
    name: happy-tails-pet-care
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: happy-tails-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: happy-tails-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: happy-tails-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: happy-tails-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: happy-tails-db
          property: password
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_SMTP_AUTH
        value: "true"
      - key: MAIL_STARTTLS
        value: "true"
      - key: PASSWORD_RESET_ENABLED
        value: "false"

databases:
  - name: happy-tails-db
    plan: free
    databaseName: happytails
    user: happytails
