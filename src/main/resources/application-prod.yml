spring:
  main:
    lazy-initialization: false
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      initialization-fail-timeout: -1
      connection-timeout: 10000
      maximum-pool-size: 4
      minimum-idle: 0
  data:
    jpa:
      repositories:
        bootstrap-mode: default
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    test-connection: false
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS:true}
  h2:
    console:
      enabled: false
server:
  address: 0.0.0.0
  port: ${PORT:10000}
  shutdown: graceful
  servlet:
    session:
      timeout: 24h
      cookie:
        http-only: true
        secure: true
        same-site: lax
happy-tails:
  password-reset:
    enabled: ${PASSWORD_RESET_ENABLED:false}
    base-url: ${APP_BASE_URL:${RENDER_EXTERNAL_URL:http://localhost:10000}}
    from: ${MAIL_FROM:no-reply@happytails.local}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      enabled: false
